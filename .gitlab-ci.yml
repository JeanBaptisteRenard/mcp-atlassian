stages:
  - test
  - build

# Unit tests — run on every merge request and on main.
test:
  stage: test
  image: ghcr.io/astral-sh/uv:bookworm-slim
  variables:
    UV_CACHE_DIR: .uv-cache
  cache:
    key: "uv-$CI_COMMIT_REF_SLUG"
    paths:
      - .uv-cache
  script:
    - uv run --frozen pytest tests/unit -q
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# Build the Skaleet mcp-atlassian image and publish it to the GitLab
# Container Registry so consumers can `docker pull` instead of building
# locally. Mirrors the pattern used by skaleet/ai/ai-usage-monitor.
build-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  needs: ["test"]
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}" -t "${CI_REGISTRY_IMAGE}:latest" .
    - docker push "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
    - docker push "${CI_REGISTRY_IMAGE}:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
